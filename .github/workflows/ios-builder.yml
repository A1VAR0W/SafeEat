name: iOS Builder
on:
  workflow_dispatch:
    inputs:
      target_environment:
        type: choice
        options: [preproduction, production]
        default: preproduction
        description: Public URLs for the unsigned build
      app:
        type: choice
        options: [expo, rust]
        default: expo
        description: expo = app 1.0.x (apps/mobile); rust = app 2.0 (apps/app, Tauri)
  workflow_call:
    inputs:
      target_environment: { type: string, default: preproduction }
      app: { type: string, default: expo }
permissions:
  contents: read
jobs:
  build:
    if: inputs.app != 'rust'
    runs-on: macos-26
    timeout-minutes: 60
    environment: ${{ inputs.target_environment || 'preproduction' }}
    env:
      APP_ENV: ${{ inputs.target_environment || 'preproduction' }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.3', cache: npm }
      - run: npm ci
      - name: Verify public release environment
        run: mkdir -p artifacts && node scripts/check-native-environment.mjs
      - run: npm run typecheck
      - run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
      - name: Install native dependencies
        run: pod install
        working-directory: apps/mobile/ios
      - name: Build unsigned Release app
        run: |
          set -euo pipefail
          xcodebuild -workspace apps/mobile/ios/SafeEat.xcworkspace -scheme SafeEat \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/safeeat-xcode.log" 2>&1 || { tail -100 "$RUNNER_TEMP/safeeat-xcode.log"; exit 1; }
      - name: Package and verify unsigned IPA
        run: bash scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SafeEat-iOS-unsigned-${{ inputs.target_environment || 'preproduction' }}
          path: artifacts/SafeEat-*.ipa
          if-no-files-found: error
          retention-days: 14

  # App 2.0 (Tauri + Leptos). Unsigned IPA: SideStore signs it on the device.
  build-rust:
    if: inputs.app == 'rust'
    runs-on: macos-26
    timeout-minutes: 90
    environment: ${{ inputs.target_environment || 'preproduction' }}
    defaults:
      run:
        working-directory: apps/app
    env:
      CARGO_TERM_COLOR: always
      APP_ENV: ${{ inputs.target_environment || 'preproduction' }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Server for this build (compiled into the app)
        run: |
          set -euo pipefail
          url="${API_PUBLIC_URL%/}"
          case "$url" in https://*) ;; *) echo "API_PUBLIC_URL must be https" >&2; exit 1 ;; esac
          curl -sf --max-time 30 "$url/api/v1/meta" | grep -q "\"environment\":\"$APP_ENV\""
          echo "SAFEEAT_API_URL=$url" >> "$GITHUB_ENV"
          # Xcode runs the Rust build itself and Tauri forwards only TAURI_*/CARGO_*
          # variables: Cargo's [env] reaches the compiler from any folder below apps/app.
          mkdir -p .cargo
          printf '[env]\nSAFEEAT_API_URL = "%s"\n' "$url" > .cargo/config.toml
          cat .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'wasm32-unknown-unknown,aarch64-apple-ios' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'apps/app -> target', cache-bin: true }
      - uses: jetli/trunk-action@v0.5.0
        with: { version: 'v0.22.1' }
      - name: Tauri CLI and XcodeGen
        run: |
          cargo install tauri-cli --version 2.12.4 --locked || cargo tauri --version
          brew install xcodegen
      - name: Generate the Xcode project
        run: |
          cargo tauri ios init --ci
          # gen/ starts from Tauri's template icon: put the SafeEat logo in.
          cargo tauri icon src-tauri/icons/source/icon.json
      - name: Build the unsigned IPA
        run: cargo tauri ios build --ci --no-sign --target aarch64 --build-number ${{ github.run_number }}
      - name: Check and name the IPA
        run: |
          set -euo pipefail
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)"
          test -s "$ipa"
          work="$(mktemp -d)"
          unzip -q "$ipa" -d "$work"
          plist="$(find "$work/Payload" -maxdepth 2 -name Info.plist | head -1)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.a1var0w.safeeat
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$plist"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$ipa" "$GITHUB_WORKSPACE/artifacts/SafeEat-$version-$APP_ENV.ipa"
          ls -l "$GITHUB_WORKSPACE/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: SafeEat-2-iOS-unsigned-${{ inputs.target_environment || 'preproduction' }}
          path: artifacts/SafeEat-*.ipa
          if-no-files-found: error
          retention-days: 14
