name: Android installed smoke
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android Builder run to install
        required: true
        type: string
      target_environment:
        type: choice
        options: [production, preproduction]
        default: production
        description: Installed build environment
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the actual Release APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          gh run download "$BUILD_RUN_ID" --name "SafeEat-Android-$TARGET_ENVIRONMENT" --dir artifacts
          cd artifacts
          sha256sum -c SafeEat-*.apk.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/android-installed-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SafeEat-Android-smoke-evidence
          path: artifacts/smoke/
          if-no-files-found: error
          retention-days: 14
