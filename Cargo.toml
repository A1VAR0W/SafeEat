[workspace]
resolver = "2"
members = [
  "crates/contracts",
  "crates/gluten-engine",
  "crates/text-norm",
  "apps/server",
]
# The app has its own workspace (wasm UI + Tauri shell), built with trunk / cargo tauri.
exclude = ["apps/app"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
safeeat-contracts = { path = "crates/contracts" }
safeeat-gluten-engine = { path = "crates/gluten-engine" }
safeeat-text-norm = { path = "crates/text-norm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
fancy-regex = "0.14"
regex = "1"
unicode-normalization = "0.1"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
