[workspace]
resolver = "2"
members = ["src-tauri", "ui", "plugins/secure", "plugins/share"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
safeeat-contracts = { path = "../../crates/contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The wasm UI is downloaded by nobody but still parsed on every start: keep it small.
[profile.release.package.safeeat-ui]
opt-level = "z"
