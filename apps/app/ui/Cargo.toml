[package]
name = "safeeat-ui"
description = "SafeEat 2.0 interface (Leptos, compiled to WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
safeeat-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "History", "Storage", "HtmlElement", "HtmlInputElement", "PopStateEvent", "Navigator", "Element", "Document", "console"] }
console_error_panic_hook = "0.1"
