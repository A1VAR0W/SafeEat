name: safeeat-local
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: safeeat
      POSTGRES_USER: safeeat
      POSTGRES_PASSWORD: local-safeeat-only
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safeeat -d safeeat']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
