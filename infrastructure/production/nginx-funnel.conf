# TLS terminates in Tailscale Funnel. Only its local PROXY-protocol connection is accepted.
server {
    listen 127.0.0.1:5100 proxy_protocol;
    server_name chat-ink.tail552c89.ts.net;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    client_max_body_size 32k;
    access_log off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location /api/ { proxy_pass http://127.0.0.1:4100; }
    location = /ready { proxy_pass http://127.0.0.1:4100; }
    location = /api-health { proxy_pass http://127.0.0.1:4100/health; }
    location / { proxy_pass http://127.0.0.1:3100; }
}
