# TLS terminates in Tailscale Funnel. Only its local PROXY-protocol connection is accepted.
server {
    listen 127.0.0.1:5100 proxy_protocol;
    server_name chat-ink.tail552c89.ts.net;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    client_max_body_size 32k;
    access_log off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location /preproduction/api/ { proxy_pass http://127.0.0.1:4200/api/; }
    location = /preproduction/ready { proxy_pass http://127.0.0.1:4200/ready; }
    location = /preproduction/api-health { proxy_pass http://127.0.0.1:4200/health; }
    location = /preproduction { return 308 /preproduction/; }
    location /preproduction/ { proxy_pass http://127.0.0.1:3200; }

    location /safeeat-downloads/ {
        alias /var/www/safeeat-downloads/;
        add_header Cache-Control "no-store";
        types {
            application/json json;
            application/x-itunes-ipa ipa;
            application/vnd.android.package-archive apk;
            image/png png;
        }
    }

    location /api/ { proxy_pass http://127.0.0.1:4100; }
    location = /ready { proxy_pass http://127.0.0.1:4100; }
    location = /api-health { proxy_pass http://127.0.0.1:4100/health; }
    location / { proxy_pass http://127.0.0.1:3100; }
}
