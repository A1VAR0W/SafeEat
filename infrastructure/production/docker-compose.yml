name: ${COMPOSE_PROJECT_NAME:-safeeat}
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: safeeat
      POSTGRES_USER: safeeat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ['postgres-data:/var/lib/postgresql/data']
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safeeat -d safeeat']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ['no-new-privileges:true']
  api:
    image: safeeat-server:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infrastructure/production/server.Dockerfile
    env_file: ${SAFEEAT_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      PORT: 4000
      TRUST_PROXY: 1
      DATABASE_URL: postgres://safeeat:${POSTGRES_PASSWORD:?required}@postgres:5432/safeeat
    ports: ['127.0.0.1:${API_PORT:-4100}:4000']
    networks: [private, egress]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Shares the host with HallowFest: keep SafeEat bounded.
    mem_limit: 384m
    cpus: 1.5
    pids_limit: 256
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
  web:
    # Same binary as the API, serving the public viewer.
    image: safeeat-server:${IMAGE_TAG:-local}
    command: ['serve', '--mode', 'web']
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?required}
      WEB_BASE_PATH: ${WEB_BASE_PATH:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_SHA256_FINGERPRINTS: ${ANDROID_SHA256_FINGERPRINTS:-}
    ports: ['127.0.0.1:${WEB_PORT:-3100}:3000']
    networks: [egress]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        ['CMD', 'safeeat-server', 'healthcheck', 'http://127.0.0.1:3000${WEB_BASE_PATH:-}/health']
      interval: 20s
      timeout: 5s
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
  ai:
    # Optional "Verificado por IA" second opinion (llama.cpp + Qwen2.5 1.5B Q4_K_M,
    # sha256 6a1a2eb6…407e). Started by deploy-server.sh only when the env file sets
    # AI_LOCAL_URL=http://ai:8080. Private network only: the model never reaches the internet.
    image: ghcr.io/ggml-org/llama.cpp@sha256:086942d6ac097c894d9d5bbaf8085c53af85e113fbb9d6d61b3748863c86aa5f
    profiles: [ai]
    command:
      [
        '-m',
        '/models/${AI_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}',
        '-t',
        '2',
        '-c',
        '2048',
        '-np',
        '1',
        '--host',
        '0.0.0.0',
        '--port',
        '8080',
      ]
    volumes: ['${AI_MODELS_DIR:-/opt/safeeat/models}:/models:ro']
    networks: [private]
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # The home server CPU is an AMD E2-6110: never let the model starve HallowFest.
    mem_limit: 1400m
    cpus: 1.5
    pids_limit: 64
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
networks:
  private: { internal: true }
  egress:
volumes:
  postgres-data:
