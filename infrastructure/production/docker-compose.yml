name: safeeat
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: safeeat
      POSTGRES_USER: safeeat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ['postgres-data:/var/lib/postgresql/data']
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safeeat -d safeeat']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ['no-new-privileges:true']
  api:
    image: safeeat-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infrastructure/production/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 1
      DATABASE_URL: postgres://safeeat:${POSTGRES_PASSWORD:?required}@postgres:5432/safeeat
    ports: ['127.0.0.1:${API_PORT:-4100}:4000']
    networks: [private, egress]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
  web:
    image: safeeat-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infrastructure/production/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?required}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_SHA256_FINGERPRINTS: ${ANDROID_SHA256_FINGERPRINTS:-}
    ports: ['127.0.0.1:${WEB_PORT:-3100}:3000']
    networks: [egress]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
networks:
  private: { internal: true }
  egress:
volumes:
  postgres-data:
